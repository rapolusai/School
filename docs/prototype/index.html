<title>Akshara School Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Full sidebar >=1024px, icon rail 640-1023px, bottom tab bar + "More" sheet below 640px. */
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-2:#EEF1EC; --line:#DCE1DA;
  --ink:#16201B; --ink-2:#4F5D55; --ink-3:#7C8A82;
  --accent:#1E6B52; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --marigold:#C98A12; --marigold-soft:#F8EBCB;
  --good:#2C7A3F; --good-soft:#DDF0E1; --warn:#A86500; --warn-soft:#F9E8C8; --bad:#B3362C; --bad-soft:#F7DEDA; --info:#2B5C9A; --info-soft:#DDE7F5;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 8px 24px rgba(22,32,27,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --side:248px; --rail:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --line:#2A3631;
  --ink:#E7EDE9; --ink-2:#A9B7AF; --ink-3:#7D8C84;
  --accent:#4FB58F; --accent-ink:#0B1A13; --accent-soft:#1C3A2F;
  --marigold:#E3AE45; --marigold-soft:#3A2F17;
  --good:#6CC488; --good-soft:#1D3526; --warn:#E4A94A; --warn-soft:#3A2D16; --bad:#EE8277; --bad-soft:#3F201D; --info:#83AEE6; --info-soft:#1C2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --line:#2A3631;
  --ink:#E7EDE9; --ink-2:#A9B7AF; --ink-3:#7D8C84;
  --accent:#4FB58F; --accent-ink:#0B1A13; --accent-soft:#1C3A2F;
  --marigold:#E3AE45; --marigold-soft:#3A2F17;
  --good:#6CC488; --good-soft:#1D3526; --warn:#E4A94A; --warn-soft:#3A2D16; --bad:#EE8277; --bad-soft:#3F201D; --info:#83AEE6; --info-soft:#1C2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.4vw,28px)} h2{font-size:18px} h3{font-size:15px;font-family:var(--f-body);font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.login-art{background:var(--accent);color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
:root[data-theme="dark"] .login-art{background:#173E31}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login-art{background:#173E31}}
.login-art .ruled{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 32px);pointer-events:none}
.login-art .margin{position:absolute;top:0;bottom:0;left:clamp(16px,3vw,40px);width:1px;background:rgba(248,200,110,.5)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--marigold);color:#1A1406;display:grid;place-items:center;font-size:19px;font-family:var(--f-display)}
.login-art h1{font-size:clamp(30px,4vw,48px);line-height:1.08;max-width:14ch;position:relative}
.login-art p{max-width:46ch;opacity:.88;position:relative}
.login-stats{display:flex;gap:28px;flex-wrap:wrap;position:relative}
.login-stats b{display:block;font-family:var(--f-display);font-size:26px}
.login-stats span{font-size:13px;opacity:.8}
.login-form{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:560px;width:100%;margin-inline:auto}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.demo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.demo:hover{border-color:var(--accent)}
.demo[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.demo b{font-weight:600;font-size:14px} .demo span{font-size:12px;color:var(--ink-3)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{padding-block:32px}.login-art h1{font-size:30px}}

/* ---------- form controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.side .brand{padding:4px 8px 16px}
.tenant{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--surface-2)}
.tenant .crest{width:30px;height:30px;border-radius:8px;background:var(--marigold-soft);color:var(--marigold);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.tenant b{font-size:13px;display:block;line-height:1.25} .tenant span{font-size:11.5px;color:var(--ink-3)}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .lbl{flex:1}
.nav a .count{font-size:11.5px;background:var(--marigold-soft);color:var(--marigold);padding:1px 7px;border-radius:99px;font-weight:600}
.side-foot{margin-top:auto;padding-top:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink)}
.top .spacer{flex:1}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);flex:none}
.me b{font-size:13px;display:block;line-height:1.2} .me span{font-size:11.5px;color:var(--ink-3)}
.proto{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--marigold-soft);color:var(--marigold);white-space:nowrap}
.content{padding:24px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.mobile-only{display:none}
.bottombar{display:none}

/* tablet rail */
@media (max-width:1023px) and (min-width:640px){
  .shell{grid-template-columns:var(--rail) minmax(0,1fr)}
  .side{padding:14px 10px;align-items:center}
  .side .brand span,.tenant,.nav-group,.nav a .lbl,.nav a .count,.side-foot .lbl{display:none}
  .side .brand{padding:4px 0 14px}
  .nav a{justify-content:center;padding:11px;position:relative}
  .nav a::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
  .nav a:hover::after{opacity:1}
  .me .who{display:none}
}
/* phone */
@media (max-width:639px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobile-only{display:inline-flex}
  .search{display:none}
  .me .who,.proto{display:none}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottombar a,.bottombar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none;background:none;border:0;border-radius:8px}
  .bottombar [aria-current="page"]{color:var(--accent)}
}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.cols,.cols.even,.cols.three{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{font-weight:600;display:block;line-height:1.25} .person span{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.hide-sm{display:none}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:0;flex:1 1 180px;max-width:280px}
.toolbar select.input{flex:0 1 160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{font-size:12px;color:var(--ink-3);white-space:nowrap;margin-left:auto}
.badge-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13.5px}
.lane-h span{font-size:12px;color:var(--ink-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kcard b{font-weight:600}
.kcard .meta{font-size:12.5px;color:var(--ink-3)}

/* attendance */
.att-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att-row:last-child{border-bottom:0}
.att-row .person{flex:1 1 180px}
.att-opts{display:flex;gap:6px}
.att-opts button{min-width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.att-opts button[aria-pressed="true"][data-v="P"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.att-opts button[aria-pressed="true"][data-v="A"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.att-opts button[aria-pressed="true"][data-v="L"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12.5px}
.cal .h{color:var(--ink-3);font-weight:600;text-align:center;font-size:11.5px}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:600;background:var(--surface-2);color:var(--ink-3);max-width:100%}
.cal .d.P{background:var(--good-soft);color:var(--good)} .cal .d.A{background:var(--bad-soft);color:var(--bad)} .cal .d.L{background:var(--warn-soft);color:var(--warn)} .cal .d.H{background:transparent;color:var(--ink-3);border:1px dashed var(--line)}

/* timetable */
.tt{display:grid;grid-template-columns:72px repeat(6,minmax(110px,1fr));gap:6px;min-width:760px}
.tt .h{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;padding:6px 0}
.tt .t{font-size:12px;color:var(--ink-3);font-family:var(--f-mono);padding-top:8px}
.slot{border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.3;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.slot b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.slot span{color:var(--ink-2)}
.slot.brk{border:1px dashed var(--line);background:transparent;color:var(--ink-3);text-align:center;border-left-width:1px}

/* plans */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.plans{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;gap:14px;position:relative}
.plan.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan .price{font-family:var(--f-display);font-size:32px;font-weight:700}
.plan .price small{font-size:14px;font-weight:500;color:var(--ink-3);font-family:var(--f-body)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px} .plan li::before{content:"✓";color:var(--accent);font-weight:700}
.plan li.no{color:var(--ink-3)} .plan li.no::before{content:"–";color:var(--ink-3)}
.tag{position:absolute;top:-11px;right:16px;background:var(--marigold);color:#1A1406;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px}

/* report card */
.rc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rc-head{background:var(--accent);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
:root[data-theme="dark"] .rc-head{background:#173E31}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rc-head{background:#173E31}}
.rc-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.grade{display:inline-grid;place-items:center;width:34px;height:26px;border-radius:6px;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}

/* overlay */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(480px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:slide .2s ease}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:pop .18s ease}
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:none;text-align:center}

.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:pop .18s ease;max-width:calc(100% - 32px)}

.steps{display:flex;gap:8px}
.steps span{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--accent)}
.receipt{border:1px dashed var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.receipt .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.receipt .tot{border-top:1px dashed var(--line);padding-top:10px;font-weight:700;font-size:16px}
/* month calendar */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal .h{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;padding:4px 0}
.mday{min-height:72px;border-radius:8px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0;border:2px solid transparent}

.chatpane{display:flex;flex-direction:column;min-width:0}
#thread{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:420px}

function bindIn(root){root.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();closeOverlay();go(a.dataset.go)});root.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.preventDefault();if(b.dataset.act!=='close'&&b.dataset.act!=='switch'&&b.dataset.act!=='logout')return;if(b.dataset.act!=='close')closeOverlay();ACT[b.dataset.act](b,e)})}
function overlay(kind,html){closeOverlay();const el=document.createElement('div');el.id='ov';el.innerHTML=`<div class="scrim ${kind==='modal'?'center':''}"><div class="${kind}" role="dialog" aria-modal="true">${html}</div></div>`;document.body.appendChild(el);const scrim=el.firstChild;scrim.onclick=e=>{if(e.target===scrim)closeOverlay()};el.querySelectorAll('[data-act="close"]').forEach(b=>b.onclick=closeOverlay);const f=el.querySelector('input,select,textarea,button');f&&f.focus();return el}
function closeOverlay(){const o=document.getElementById('ov');o&&o.remove()}

let toastT;function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=ic('check')+esc(msg);document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800)}

/* ---------------- charts ---------------- */
function bars(data,{h=200,max,fmt=v=>v,color='var(--accent)',second}={}){
 const w=640,pl=44,pb=26,pt=12,n=data.length;const mx=max||Math.max(...data.map(d=>Math.max(d.v,d.v2||0)))*1.1;
 const bw=(w-pl-10)/n;const y=v=>pt+(h-pt-pb)*(1-v/mx);
 const ticks=[0,.25,.5,.75,1].map(t=>mx*t);
 return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">${ticks.map(t=>`<line x1="${pl}" x2="${w-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('')}
 ${data.map((d,i)=>{const x=pl+i*bw;const inner=second?bw*.32:bw*.5;const x1=x+(bw-(second?inner*2+4:inner))/2;
  return `<rect x="${x1}" y="${y(d.v)}" width="${inner}" height="${y(0)-y(d.v)}" rx="3" fill="${color}"><title>${d.l}: ${fmt(d.v)}</title></rect>${second?`<rect x="${x1+inner+4}" y="${y(d.v2)}" width="${inner}" height="${y(0)-y(d.v2)}" rx="3" fill="${second}"><title>${d.l}: ${fmt(d.v2)}</title></rect>`:''}<text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${d.l}</text>`}).join('')}</svg></div>`}
function line(data,{h=200,fmt=v=>v,min,max}={}){
 const w=640,pl=48,pb=26,pt=14,n=data.length;const mn=min??0,mx=max??Math.max(...data.map(d=>d.v))*1.15;
 const x=i=>pl+i*(w-pl-16)/(n-1),y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));
 const pts=data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');const ticks=[0,.25,.5,.75,1].map(t=>mn+(mx-mn)*t);const last=data[n-1];
 return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Line chart">${ticks.map(t=>`<line x1="${pl}" x2="${w-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('')}
 <polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="var(--accent)" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
 ${data.map((d,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${d.l}</text>`).join('')}<circle cx="${x(n-1)}" cy="${y(last.v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x(n-1)-8}" y="${y(last.v)-12}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt(last.v)}</text></svg></div>`}
function donut(parts,label){const tot=parts.reduce((a,p)=>a+p.v,0);let a0=-Math.PI/2;const r=56,cx=70,cy=70;
 const segs=parts.map(p=>{const a1=a0+p.v/tot*Math.PI*2;const large=a1-a0>Math.PI?1:0;const d=`M${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}`;a0=a1;return `<path d="${d}" fill="none" stroke="${p.c}" stroke-width="18"/>`}).join('');
 return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}">${segs}<text x="70" y="68" text-anchor="middle" style="font:700 22px var(--f-display);fill:var(--ink)">${label}</text><text x="70" y="88" text-anchor="middle" style="font-size:11px;fill:var(--ink-3)">today</text></svg><div class="list" style="flex:1;min-width:140px">${parts.map(p=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.c};margin-right:8px"></i>${p.l}</span><b class="num">${p.v.toLocaleString('en-IN')}</b></div>`).join('')}</div></div>`}

 admissions(){document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>{const a=APPS[+b.dataset.adv];a.stage++;render();toast(a.name+' moved to '+STAGES[a.stage]+(a.stage===4?'. Student record created.':''))})},
 attendance(){const c=$('#attcls');if(c)c.onchange=e=>{S.attCls=e.target.value;render()};document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{S.att[b.dataset.att]=b.dataset.v;render()})},
 exams(){$('#exsub').onchange=e=>{S.examSub=e.target.value;render()};document.querySelectorAll('[data-mk]').forEach(inp=>inp.oninput=()=>{let v=Math.max(0,Math.min(100,+inp.value||0));MARKS[S.examSub][+inp.dataset.mk]=v;const i=inp.dataset.mk;$('#g'+i).textContent=grade(v);$('#r'+i).textContent=v>=90?'Outstanding':v>=75?'Very good':v>=60?'Good, keep practising':'Needs support';const m=MARKS[S.examSub];$('#exavg').innerHTML='Class average: <b class="num" style="color:var(--ink)">'+Math.round(m.reduce((a,b)=>a+b,0)/m.length)+'</b> · unsaved changes'})},
 homework(){document.querySelectorAll('[data-hwdone]').forEach(b=>b.onclick=()=>{HOMEWORK[+b.dataset.hwdone].done=true;render();toast('Marked as submitted')})},
 subscription(){document.querySelectorAll('[data-cyc]').forEach(b=>b.onclick=()=>{S.planCycle=b.dataset.cyc;render()});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const p=PLANS.find(x=>x.n===b.dataset.plan);const y=S.planCycle==='yearly';overlay('modal',`<div class="ov-head"><h2>${b.textContent.trim()} to ${p.n}?</h2><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div><p class="muted">${p.n==='Starter'?'Starter allows 300 students. You have 1,240, so new admissions would be blocked until you upgrade again. Transport and library become read-only.':'New features unlock immediately. You pay the prorated difference today: <b class="num" style="color:var(--ink)">'+inr((y?p.m*10-59990:p.m-5999)*0.6)+'</b> + GST for the rest of this cycle.'}</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="close">Keep Growth</button><button class="btn primary" id="okplan">Confirm ${p.n}</button></div>`);$('#okplan').onclick=()=>{closeOverlay();toast('Plan change scheduled (sandbox)')}})},
 settings(){document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{S.filter.st=+b.dataset.stab;render()});const f=$('#setf');if(f)f.onsubmit=e=>{e.preventDefault();SCHOOL.name=$('#s1').value;toast('School profile saved')}},
 frontoffice(){document.querySelectorAll('[data-vout]').forEach(b=>b.onclick=()=>{VISITORS[+b.dataset.vout].out='11:36';render();toast('Visitor checked out')})},
 messages(){const C=S.role==='parent'?CONV_P:CONV_S;document.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>{S.conv=+b.dataset.conv;C[S.conv].unread=0;render()});const th=$('#thread');th.scrollTop=th.scrollHeight;$('#msgf').onsubmit=e=>{e.preventDefault();const v=$('#msgin').value.trim();if(!v)return;C[Math.min(S.conv||0,C.length-1)].msgs.push([1,v,'Now']);render();$('#msgin').focus()}},
 requests(){$('#lvf').onsubmit=e=>{e.preventDefault();const f=$('#l1').value,t=$('#l2').value;const fmt=x=>x?Number(x.slice(8))+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(x.slice(5,7))-1]:'';LEAVES.unshift({d:fmt(f)+(t&&t!==f?' to '+fmt(t):''),r:$('#l3').value,st:'Pending'});render();toast('Leave request sent to Fatima Shaikh')};document.querySelectorAll('[data-ptm]').forEach(b=>b.onclick=()=>{S.ptm=+b.dataset.ptm;render();toast('PTM slot booked for '+PTM[S.ptm][0])})},
 myfees(){},
 dashboard(){AFTER_ALL()}
};
function AFTER_ALL(){}
/* delegated clicks for things rendered in many views */
document.addEventListener('click',e=>{
 const x=e.target.closest('[data-x]');if(x&&!x.closest('#ov')||x&&x.closest('#ov')&&x.dataset.x){if(x){const k=x.dataset.x;if(X[k]){e.preventDefault();X[k](x)}else if(k){e.preventDefault();toast({import:'Excel import opens a column-mapping step',feestruct:'Fee structures are set per class and term',leave:'Leave approvals: 2 pending',addstaff:'Staff onboarding form',addclass:'Section added',ttedit:'Drag periods to rearrange (planned)',assignroute:'Pick a student and a stop',issue:'Scan a book barcode to issue',addbook:'Add by ISBN lookup',report:'Report queued. You will get it by email.',invoice:'Invoice PDF downloaded (sandbox)',pdf:'PDF is generated by the server in the real app',outpass:'3 outing requests: approve after parent confirms',allot:'Pick a block, room and bed',infirmary:'Log visit: student, complaint, action, parent informed',addevent:'Add a holiday, exam or event; parents see it at once',payslips:'Payslips emailed to 64 staff (sandbox)',openmat:'Opens in the built-in viewer',qbank:'Question bank: 1,240 questions tagged by chapter and difficulty',addlesson:'Lesson plan form: objectives, activities, resources',udise:'UDISE+ file prepared in the government format'}[k]||'Coming in the full build')}}return}
 const c=e.target.closest('[data-collect]');if(c){X.collect(null,c.dataset.collect);return}
 const st=e.target.closest('[data-student]');if(st){studentDrawer(st.dataset.student);return}
 const tn=e.target.closest('[data-tenant]');if(tn){tenantDrawer(tn.dataset.tenant);return}
});

/* boot */
(function(){const h=(location.hash||'').slice(1);if(h&&P[h]){S.role='admin';S.page=navFor('admin').includes(h)?h:'dashboard'}render()})();
</script>
