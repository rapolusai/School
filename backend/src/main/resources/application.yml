# Settings come from environment variables. In AWS they are injected from Secrets Manager and SSM Parameter Store;
# nothing secret is stored in this file.
spring:
  application:
    name: akshara-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akshara}
    # The runtime role: no table ownership, no BYPASSRLS, so row-level security always applies.
    username: ${DB_APP_USER:akshara_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the owner role; the API itself never connects as it.
    user: ${DB_OWNER_USER:akshara_owner}
    password: ${DB_OWNER_PASSWORD:}
    placeholders:
      appRole: ${DB_APP_USER:akshara_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Uploads (homework attachments and submissions): 5 MB per file, a few files per request. The files module
      # checks the same 5 MB limit and the file type itself; these are the container's hard limits.
      max-file-size: 5MB
      max-request-size: 26MB
      file-size-threshold: 1MB

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

akshara:
  auth:
    jwt-secret: ${JWT_SECRET:}
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  security:
    allow-privileged-db-role: false
  trial:
    length: P14D
  platform:
    bootstrap-admin:
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      name: ${PLATFORM_ADMIN_NAME:Platform Admin}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}
  notifications:
    dispatch:
      # Sends queued messages (absence alerts). Only the simulated sender exists for now: nothing leaves the system.
      enabled: ${NOTIFICATIONS_DISPATCH_ENABLED:true}
      interval: ${NOTIFICATIONS_DISPATCH_INTERVAL:PT15S}
  payments:
    # Online fee payments. Only the sandbox gateway exists; it makes no network calls. Its secret signs sandbox
    # payments and webhooks (a random one is made at startup when empty). Real gateway keys come from Secrets Manager.
    gateway: ${PAYMENTS_GATEWAY:sandbox}
    sandbox:
      secret: ${PAYMENTS_SANDBOX_SECRET:}
  communication:
    scheduler:
      # Sends scheduled circulars and calendar reminders when they are due (their messages go through the outbox).
      enabled: ${COMMUNICATION_SCHEDULER_ENABLED:true}
      interval: ${COMMUNICATION_SCHEDULER_INTERVAL:PT1M}
    cost:
      # Indicative prices in paise for the estimate shown before sending a circular. Nothing is charged here.
      sms-part-paise: ${COMMUNICATION_COST_SMS_PART_PAISE:20}
      whatsapp-paise: ${COMMUNICATION_COST_WHATSAPP_PAISE:12}
      email-paise: ${COMMUNICATION_COST_EMAIL_PAISE:0}
  homework:
    reminders:
      # The evening before homework is due, parents of students who have not submitted get a reminder (only in schools
      # that switched homework reminders on). Runs hourly from 17:00 to 20:00 India time; each homework is done once.
      enabled: ${HOMEWORK_REMINDERS_ENABLED:true}
      cron: ${HOMEWORK_REMINDERS_CRON:0 0 17-20 * * *}
  billing:
    # Akshara as the seller on the schools' GST invoices. The defaults are obvious placeholders (never a real GSTIN);
    # every environment sets the real values from SSM Parameter Store.
    seller:
      name: ${BILLING_SELLER_NAME:Akshara School Cloud (sample seller)}
      address: "${BILLING_SELLER_ADDRESS:Sample address - set BILLING_SELLER_ADDRESS}"
      state-code: ${BILLING_SELLER_STATE_CODE:36}
      gstin: ${BILLING_SELLER_GSTIN:36XXXXX0000X1ZX}
    # SAC 998315: hosting and IT infrastructure provisioning, which covers software as a service.
    sac-code: ${BILLING_SAC_CODE:998315}
    invoice-prefix: ${BILLING_INVOICE_PREFIX:AKS}
    payment-terms-days: 15
    renewal-window-days: 30
    trial-warning-days: 7
  # Shown on the Super Admin's platform health page. Maven fills in the project version; CI may pass the commit.
  build:
    version: ${APP_VERSION:@project.version@}

---
# In AWS the API never holds the owner password: migrations run as a separate one-off task (profile "migrate").
spring:
  config:
    activate:
      on-profile: aws
  flyway:
    enabled: false
server:
  # The API sits behind the load balancer; trust its X-Forwarded-For so rate limits see the real client.
  forward-headers-strategy: native

---
# One-off task run by the deploy pipeline before new API tasks start: apply migrations, seed, then exit.
spring:
  config:
    activate:
      on-profile: migrate
  flyway:
    enabled: true
  main:
    web-application-type: none
akshara:
  notifications:
    dispatch:
      enabled: false
  communication:
    scheduler:
      enabled: false
  homework:
    reminders:
      enabled: false
