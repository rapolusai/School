name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, unit and integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers using the runner's Docker.
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: backend/target/surefire-reports/

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform (format and validate, no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  e2e:
    name: End-to-end (Playwright against the real API and web app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akshara
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d akshara"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Generate throwaway secrets for this run
        run: |
          for name in DB_OWNER_PASSWORD DB_APP_PASSWORD JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Create database roles
        env:
          PGPASSWORD: ci-only-postgres
        run: |
          psql -h localhost -U postgres -d akshara -v ON_ERROR_STOP=1 \
            -v owner_password="$DB_OWNER_PASSWORD" -v app_password="$DB_APP_PASSWORD" <<'SQL'
          create role akshara_owner login password :'owner_password';
          create role akshara_app login password :'app_password' nosuperuser nobypassrls;
          alter database akshara owner to akshara_owner;
          SQL
      - name: Start the API
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/akshara
          COOKIE_SECURE: "false"
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/akshara-api-*.jar > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat ../api.log; exit 1
      - name: Build and start the web app
        working-directory: frontend
        env:
          API_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > ../web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat ../web.log; exit 1
      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            api.log
            web.log

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
