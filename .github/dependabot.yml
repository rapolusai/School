# Weekly pull requests for outdated or vulnerable dependencies. Security fixes arrive as soon as GitHub knows of
# them (Dependabot security updates, turned on in the repository's settings). Minor and patch updates are grouped
# into one PR per ecosystem so they are reviewed and merged together; majors come one by one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
