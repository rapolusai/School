# Local stack: PostgreSQL, the API and the web app. Copy .env.example to .env first.
#   docker compose up --build
# Then open http://localhost:3000 (or the WEB_PORT set in .env).
name: akshara

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: akshara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akshara"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/akshara
      DB_APP_USER: akshara_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_OWNER_USER: akshara_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      args:
        # Baked in at build time: the web server forwards /api/* to the API container.
        API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  db-data:
